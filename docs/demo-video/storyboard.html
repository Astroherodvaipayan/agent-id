const scenes=[

function render(index,phase){const s=scenes[index],start=phase<.5?0:(phase-.5)*2;document.getElementById('shot').src=s.img;document.getElementById('eyebrow').textContent=s.eyebrow;document.getElementById('number').textContent=String(index+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');document.getElementById('title').textContent=s.title;document.getElementById('body').textContent=s.body;document.getElementById('stageLabel').textContent=s.label;document.getElementById('stageNote').textContent=s.note;document.getElementById('bar').style.width=((index+phase)/scenes.length*100)+'%';let x=s.from[0]+(s.to[0]-s.from[0])*Math.min(1,start),y=s.from[1]+(s.to[1]-s.from[1])*Math.min(1,start)+90;const cursor=document.getElementById('cursor'),shadow=document.getElementById('shadow'),ring=document.getElementById('ring'),focus=document.getElementById('focus');cursor.style.cssText=`left:${x}px;top:${y}px`;shadow.style.cssText=`left:${x+3}px;top:${y+3}px`;const pulse=Math.max(0,1-Math.abs(phase-.78)*7);ring.style.cssText=`left:${x-26}px;top:${y-26}px;opacity:${pulse};transform:scale(${.5+(.8*pulse)})`;focus.style.cssText=`left:${s.focus[0]}px;top:${s.focus[1]+90}px;width:${s.focus[2]}px;height:${s.focus[3]}px;opacity:${Math.min(1,Math.max(0,(phase-.4)*4))}`}
